server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location /api/history/ {
        proxy_pass http://historian:8001/api/history/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location /api/ {
        proxy_pass http://plc-simulator:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location = /health {
        proxy_pass http://plc-simulator:8000/health;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
